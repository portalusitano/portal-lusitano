name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # Sem isto o passo de comentar apanha «403 Resource not accessible by
    # integration»: o token por omissão só lê. A API pede exactamente estas
    # duas, e vêm no cabeçalho da própria resposta.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # A v10 carrega o relatório pela API de artefactos v3, que o GitHub já
      # retirou: a auditoria corria toda e o trabalho morria no fim, em
      # «Create Artifact Container failed: The artifact name lighthouse-results
      # is not valid». A v11 é a que o outro workflow já usa.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          # `/loja` e `/jornal` são de quando isto ainda não era um
          # classificados. Já não existem — davam 404, e o Lighthouse
          # desiste da corrida inteira quando não consegue carregar uma das
          # páginas que lhe mandam auditar.
          urls: |
            http://localhost:3000
            http://localhost:3000/comprar
            http://localhost:3000/directorio
            http://localhost:3000/vender-cavalo
          uploadArtifacts: true
          temporaryPublicStorage: true
          budgetPath: ./lighthouse-budget.json

      # Um comentário que não sai não invalida uma auditoria que correu: os
      # resultados ficam no registo e no relatório público de qualquer forma.
      - name: Comment PR with Lighthouse scores
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('.lighthouseci/manifest.json'));

            const comment = `## 🔦 Lighthouse CI Results

            ${results.map(r => `
            **${r.url}**
            - Performance: ${r.summary.performance}
            - Accessibility: ${r.summary.accessibility}
            - Best Practices: ${r.summary['best-practices']}
            - SEO: ${r.summary.seo}
            `).join('\n')}

            ${results[0]?.reportUrl ? `[Ver relatório completo](${results[0].reportUrl})` : ""}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
